services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: coldchain
      POSTGRES_USER: coldchain
      POSTGRES_PASSWORD: coldchain123
    ports:
      - "5432:5432"
    volumes:
      - coldchain-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coldchain"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: coldchain
      DB_USER: coldchain
      DB_PASSWORD: coldchain123
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8081:80"

volumes:
  coldchain-pg:
